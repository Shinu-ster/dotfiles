unbind r
bind r source-file ~/.tmux.conf


set -g prefix C-s


bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'janoamaral/tokyo-night-tmux'

# ~/.tmux.conf
#set -ogq @catppuccin_window_text " #W"
#set -ogq @catppuccin_window_current_text " #W"

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Configure the catppuccin plugin
#set -g @catppuccin_flavor "mocha"
#set -g @catppuccin_window_status_style "rounded"


#set -ogq @catppuccin_color_dark "#1E1E2E"      # base
#set -ogq @catppuccin_color_surface "#313244"   # surface0
#set -g @catppuccin_status_background "#1E1E2E"

# Load catppuccin
#run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# For TPM, instead use `run ~/.tmux/plugins/tmux/catppuccin.tmux`

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
#set -g status-right "#{E:@catppuccin_status_application}"
#set -ag status-right "#{E:@catppuccin_status_session}"

set -g @tokyo-night-tmux_theme storm    # storm | night | day
set -g @tokyo-night-tmux_transparent 1
set -g @tokyo-night-tmux_window_id_style digital
set -g @tokyo-night-tmux_show_datetime 0

#set -g @catppuccin_window_text " #W"
#set -g @catppuccin_window_default_text " #W"
#set -g @catppuccin_window_current_text " #W"

# Disable automatic window renaming
# set-option -g automatic-rename off
set-option -g automatic-rename-format '#{pane_current_command}'
set-option -g allow-rename on

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM


run '~/.tmux/plugins/tpm/tpm'

set -g message-style "bg=#24283b,fg=#e0af68,fill=#24283b"
set -g message-command-style "bg=#24283b,fg=#e0af68,fill=#24283b,bold"
